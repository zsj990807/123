<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pali's Menu · 小程序 UI 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7F1E4;
  --cream-2:#FCF8EF;
  --ink:#2E3A26;
  --ink-2:#3F4C34;
  --olive:#7C8C63;
  --olive-deep:#5F6E49;
  --coral:#DF8757;
  --muted:#8F8674;
  --line:#E7DDC9;
  --serif:"Playfair Display","Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --script:"Caveat","Segoe Script",cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#E7E0D2;font-family:var(--sans);color:var(--ink);
}
.phone{
  position:relative;width:min(430px,100vw);height:100vh;height:100dvh;
  background:var(--cream);display:flex;flex-direction:column;overflow:hidden;
}
@media (min-width:560px){
  .phone{height:min(900px,94vh);border-radius:40px;box-shadow:0 34px 90px rgba(46,58,38,.28),0 2px 0 rgba(255,255,255,.6) inset}
}

/* ---------- 可滚动区 ---------- */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:86px}
.scroll::-webkit-scrollbar{display:none}

/* ---------- 顶部品牌区 ---------- */
.hero{
  position:relative;padding:30px 12px 20px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 0%,#FCF8EE 0%,#F7F1E4 58%,#F3ECDB 100%);
}
.hero .branch{position:absolute;top:6px;width:96px;opacity:0;animation:branchIn .9s cubic-bezier(.22,.8,.24,1) .1s forwards}
.hero .branch.l{left:-16px}
.hero .branch.r{right:-8px;width:104px}
@keyframes branchIn{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}

.brand{position:relative;z-index:2;text-align:center;padding-top:14px}
.brand h1{
  font-family:var(--serif);font-weight:600;color:var(--ink);
  font-size:clamp(38px,11.4vw,52px);line-height:1;letter-spacing:.01em;
  margin:0;opacity:0;animation:riseIn .8s cubic-bezier(.22,.8,.24,1) .18s forwards;
}
.brand .sub{
  font-size:10.5px;letter-spacing:.30em;color:var(--ink-2);font-weight:500;
  margin:14px 0 0;text-transform:uppercase;opacity:0;
  animation:riseIn .8s cubic-bezier(.22,.8,.24,1) .3s forwards;
}
.tagline{
  position:relative;display:inline-block;margin:16px 0 0;
  font-family:var(--serif);font-size:clamp(17px,4.9vw,21px);color:var(--ink-2);
  letter-spacing:.04em;opacity:0;animation:riseIn .8s cubic-bezier(.22,.8,.24,1) .42s forwards;
}
.tagline svg{position:absolute;left:2px;right:2px;bottom:-9px;width:calc(100% - 4px);height:10px}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.heart-doodle{position:absolute;top:32px;right:28%;width:34px;opacity:0;animation:heartIn .9s cubic-bezier(.22,.8,.24,1) .55s forwards}
@keyframes heartIn{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:.95;transform:rotate(-8deg)}}

.script-note{
  position:absolute;right:4px;bottom:26px;width:118px;text-align:center;
  font-family:var(--script);font-size:17px;line-height:1.06;color:var(--coral);
  transform:rotate(-3deg);opacity:0;animation:riseIn .9s cubic-bezier(.22,.8,.24,1) .68s forwards;
}

/* ---------- 分类 Tab ---------- */
.tabs-wrap{
  position:sticky;top:0;z-index:6;background:var(--cream);padding:6px 16px 12px;
  transition:box-shadow .28s ease;
}
.tabs-wrap.stuck{box-shadow:0 8px 18px -14px rgba(46,58,38,.55)}
.tabs{
  position:relative;display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--cream-2);border:1px solid var(--line);
  border-radius:999px;height:50px;align-items:center;
}
.tabs .pill{
  position:absolute;top:5px;left:5px;height:40px;width:calc((100% - 10px)/3);
  background:var(--olive-deep);border-radius:999px;
  transition:transform .36s cubic-bezier(.22,.9,.26,1);
}
.tab{
  position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:7px;
  height:100%;background:none;border:0;font-family:var(--sans);cursor:pointer;
  font-size:16px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;
  transition:color .3s ease;
}
.tab svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
.tab.active{color:#FBF6EA}

/* ---------- 菜品列表 ---------- */
.menu{padding:2px 16px 8px}
.dish{
  display:flex;gap:14px;align-items:flex-start;padding:16px 0 16px;
  border-top:1px solid var(--line);cursor:pointer;
  opacity:0;transform:translateY(14px);
  animation:dishIn .55s cubic-bezier(.22,.8,.24,1) forwards;
  animation-delay:calc(var(--i) * 70ms);
}
.dish:first-child{border-top:0}
@keyframes dishIn{to{opacity:1;transform:none}}
.dish:active{transform:scale(.985);transition:transform .12s ease}
.dish:active .thumb{filter:brightness(.96)}

.thumb{
  flex:0 0 92px;width:92px;height:72px;border-radius:9px;object-fit:cover;
  background:#EFE8D8;box-shadow:0 3px 10px -6px rgba(46,58,38,.6);
}
.dish-info{flex:1;min-width:0}
.dish-name{
  font-size:19.5px;font-weight:700;color:var(--ink);letter-spacing:.02em;
  margin:1px 0 0;line-height:1.25;
}
.dish-desc{
  font-family:var(--serif);font-size:13.5px;color:var(--muted);
  margin:7px 0 0;line-height:1.4;letter-spacing:.02em;
}
.dish-meta{
  display:flex;align-items:center;gap:9px;margin-top:11px;
  font-size:12.5px;color:var(--muted);letter-spacing:.04em;
}
.dish-meta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;flex:0 0 13px}
.dish-meta .sep{width:1px;height:12px;background:var(--line)}

/* ---------- 底部导航 ---------- */
.bottom-nav{
  position:absolute;left:0;right:0;bottom:0;z-index:8;
  display:grid;grid-template-columns:1fr 1fr;align-items:center;
  height:74px;padding-bottom:env(safe-area-inset-bottom);
  background:rgba(252,248,239,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
.bottom-nav button{
  position:relative;background:none;border:0;height:100%;cursor:pointer;
  font-family:var(--sans);font-size:14.5px;font-weight:600;letter-spacing:.06em;
  color:var(--muted);transition:color .28s ease;
}
.bottom-nav button .dot{
  position:absolute;left:50%;bottom:16px;width:5px;height:5px;border-radius:50%;
  background:var(--olive-deep);transform:translateX(-50%) scale(0);transition:transform .3s cubic-bezier(.22,.9,.26,1);
}
.bottom-nav button.on{color:var(--olive-deep)}
.bottom-nav button.on .dot{transform:translateX(-50%) scale(1)}

/* ---------- 菜品详情页 ---------- */
.detail{
  position:absolute;inset:0;z-index:20;background:var(--cream);
  display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform .38s cubic-bezier(.22,.9,.26,1);
  box-shadow:-20px 0 44px -26px rgba(46,58,38,.7);
}
.detail.open{transform:none}
.detail-scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:10px}
.detail-scroll::-webkit-scrollbar{display:none}

.d-hero{position:relative;height:clamp(232px,38vh,310px);flex:0 0 auto;background:#EFE8D8}
.d-hero img{width:100%;height:100%;object-fit:cover;display:block}
.d-hero .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,58,38,.24) 0%,rgba(46,58,38,0) 36%)}
.d-back{
  position:absolute;top:14px;left:14px;width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;border:0;
  background:rgba(247,241,228,.88);backdrop-filter:blur(10px);
  box-shadow:0 4px 14px -8px rgba(46,58,38,.9);
}
.d-back:active{transform:scale(.94)}
.d-back svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.d-chip{
  position:absolute;top:19px;right:14px;padding:6px 13px;border-radius:999px;
  font-size:11.5px;font-weight:600;letter-spacing:.16em;color:#FBF6EA;
  background:rgba(95,110,73,.88);backdrop-filter:blur(10px);
}

/* 内容纸张：上移覆盖图片，形成叠压层次 */
.d-sheet{
  position:relative;margin-top:-26px;background:var(--cream);
  border-radius:28px 28px 0 0;padding:22px 20px 8px;
}
.d-title{font-family:var(--serif);font-weight:600;color:var(--ink);margin:0;line-height:1.18;
  font-size:clamp(26px,7.4vw,32px);letter-spacing:.02em}
.d-sub{font-family:var(--serif);font-size:13.5px;color:var(--muted);margin:9px 0 0;letter-spacing:.03em}

/* 三项信息：无卡片，仅分隔线 */
.d-facts{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.d-fact{padding:13px 4px;text-align:center}
.d-fact + .d-fact{border-left:1px solid var(--line)}
.d-fact .k{font-size:10.5px;letter-spacing:.2em;color:var(--muted)}
.d-fact .v{font-size:14.5px;font-weight:600;color:var(--ink-2);margin-top:5px;letter-spacing:.02em}

/* 主厨的话 */
.d-quote{margin:20px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--coral);
  font-family:var(--serif);font-size:14px;line-height:1.62;color:var(--ink-2)}
.d-quote .who{display:block;margin-top:8px;font-family:var(--sans);
  font-size:11.5px;letter-spacing:.14em;color:var(--coral)}

/* 区段标题 */
.d-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 6px}
.d-h h2{font-size:16px;font-weight:700;color:var(--ink);margin:0;letter-spacing:.08em}
.d-h span{font-size:10.5px;letter-spacing:.2em;color:var(--muted)}

/* 食材：点线引导 */
.d-ing{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--ink-2);
  padding:9px 0;border-bottom:1px dashed var(--line)}
.d-ing:last-child{border-bottom:0}
.d-ing .dots{flex:1;border-bottom:1px dotted #D9CEB7;transform:translateY(-4px)}
.d-ing .amt{font-family:var(--serif);font-size:13px;color:var(--muted)}

/* 做法步骤 */
.d-step{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.d-step:last-child{border-bottom:0}
.d-step .no{flex:0 0 24px;padding-top:1px;font-family:var(--serif);
  font-size:15px;font-weight:600;color:var(--coral)}
.d-step p{margin:0;font-family:var(--serif);font-size:14px;line-height:1.6;color:var(--ink-2)}

/* 底部操作条 */
.d-bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(252,248,239,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;height:44px;padding:0 4px;gap:2px;
  background:var(--cream-2);border:1px solid var(--line);border-radius:999px}
.stepper button{width:36px;height:36px;border:0;background:none;cursor:pointer;border-radius:50%;
  display:grid;place-items:center;font-size:19px;color:var(--olive-deep)}
.stepper button:active{background:rgba(95,110,73,.12)}
.stepper .qty{min-width:26px;text-align:center;font-size:15px;font-weight:700;color:var(--ink)}
.add-btn{
  flex:1;height:44px;border:0;border-radius:999px;cursor:pointer;
  background:var(--olive-deep);color:#FBF6EA;font-family:var(--sans);
  font-size:15px;font-weight:600;letter-spacing:.08em;
  box-shadow:0 8px 20px -14px rgba(95,110,73,1);
  transition:transform .14s ease, background .2s ease;
}
.add-btn:active{transform:scale(.98);background:#556342}

/* 轻提示 */
.toast{position:absolute;left:50%;bottom:100px;z-index:40;white-space:nowrap;
  padding:10px 18px;border-radius:999px;background:rgba(46,58,38,.94);color:#FBF6EA;
  font-size:13px;letter-spacing:.06em;pointer-events:none;opacity:0;
  transform:translate(-50%,10px);transition:opacity .26s ease, transform .26s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="phone">

  <div class="scroll" id="scroll">

    <!-- 品牌区 -->
    <header class="hero">
      <svg class="branch l" viewBox="0 0 110 150" fill="none" aria-hidden="true">
        <path d="M8 146 C 30 124 46 98 60 70 C 70 50 80 32 96 14" stroke="#93A177" stroke-width="1.8" stroke-linecap="round"/>
        <g fill="#7C8C63">
          <ellipse cx="18" cy="128" rx="5" ry="15" transform="rotate(-50 18 128)"/>
          <ellipse cx="32" cy="132" rx="5" ry="15" transform="rotate(20 32 132)"/>
          <ellipse cx="32" cy="108" rx="5" ry="15" transform="rotate(-50 32 108)"/>
          <ellipse cx="46" cy="112" rx="5" ry="15" transform="rotate(20 46 112)"/>
          <ellipse cx="46" cy="86" rx="5" ry="15" transform="rotate(-48 46 86)"/>
          <ellipse cx="60" cy="90" rx="5" ry="15" transform="rotate(22 60 90)"/>
          <ellipse cx="58" cy="64" rx="5" ry="15" transform="rotate(-46 58 64)"/>
          <ellipse cx="72" cy="68" rx="5" ry="15" transform="rotate(24 72 68)"/>
          <ellipse cx="72" cy="44" rx="5" ry="15" transform="rotate(-44 72 44)"/>
          <ellipse cx="84" cy="48" rx="5" ry="15" transform="rotate(26 84 48)"/>
          <ellipse cx="86" cy="26" rx="5" ry="15" transform="rotate(-40 86 26)"/>
          <ellipse cx="96" cy="30" rx="5" ry="15" transform="rotate(28 96 30)"/>
        </g>
      </svg>

      <svg class="branch r" viewBox="0 0 110 150" fill="none" aria-hidden="true">
        <path d="M6 12 C 26 34 42 60 56 88 C 66 108 76 126 92 144" stroke="#93A177" stroke-width="1.8" stroke-linecap="round"/>
        <g fill="#7C8C63">
          <ellipse cx="18" cy="28" rx="5" ry="15" transform="rotate(50 18 28)"/>
          <ellipse cx="30" cy="24" rx="5" ry="15" transform="rotate(-20 30 24)"/>
          <ellipse cx="30" cy="48" rx="5" ry="15" transform="rotate(50 30 48)"/>
          <ellipse cx="44" cy="44" rx="5" ry="15" transform="rotate(-20 44 44)"/>
          <ellipse cx="44" cy="70" rx="5" ry="15" transform="rotate(48 44 70)"/>
          <ellipse cx="58" cy="66" rx="5" ry="15" transform="rotate(-22 58 66)"/>
          <ellipse cx="56" cy="92" rx="5" ry="15" transform="rotate(46 56 92)"/>
          <ellipse cx="70" cy="88" rx="5" ry="15" transform="rotate(-24 70 88)"/>
          <ellipse cx="70" cy="112" rx="5" ry="15" transform="rotate(44 70 112)"/>
          <ellipse cx="82" cy="108" rx="5" ry="15" transform="rotate(-26 82 108)"/>
        </g>
        <g fill="#66764D">
          <circle cx="76" cy="34" r="5.4"/><circle cx="62" cy="56" r="5"/><circle cx="50" cy="78" r="4.6"/>
        </g>
        <g fill="#A3B183">
          <circle cx="74.2" cy="32.4" r="1.5"/><circle cx="60.4" cy="54.4" r="1.4"/><circle cx="48.6" cy="76.4" r="1.3"/>
        </g>
      </svg>

      <div class="brand">
        <h1>Pali&#39;s Menu</h1>
        <p class="sub">One Guest &nbsp;·&nbsp; One Personal Chef</p>
        <span class="tagline">
          今天吃什么，听你的。
          <svg viewBox="0 0 200 10" preserveAspectRatio="none" aria-hidden="true">
            <path d="M1 7 C 26 1 52 9 78 4 C 104 -1 130 8 156 3 C 174 0 190 5 199 4"
                  stroke="#DF8757" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
        </span>
      </div>

      <svg class="heart-doodle" viewBox="0 0 40 38" fill="none" aria-hidden="true">
        <path d="M20 35 C 6 24 2 17 3 11 C 4 5 10 3 15 6 C 18 8 19 11 20 13 C 21 11 22 8 25 6 C 30 3 36 5 37 11 C 38 17 34 24 20 35 Z"
              stroke="#DF8757" stroke-width="2" stroke-linejoin="round"/>
        <path d="M12 12 C 10 14 10 17 11 19" stroke="#DF8757" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
      </svg>

      <div class="script-note">Good Food<br>Brings Us Closer.</div>
    </header>

    <!-- 分类 Tab -->
    <div class="tabs-wrap" id="tabsWrap">
      <div class="tabs" id="tabs">
        <span class="pill" id="pill"></span>
      </div>
    </div>

    <!-- 菜单列表 -->
    <main class="menu" id="menu"></main>

  </div>

  <!-- 菜品详情页 -->
  <section class="detail" id="detail" aria-hidden="true">
    <div class="detail-scroll" id="detailScroll">
      <div class="d-hero">
        <img id="dImg" src="" alt="">
        <div class="fade"></div>
        <button class="d-back" id="dBack" aria-label="返回">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <span class="d-chip" id="dChip"></span>
      </div>

      <div class="d-sheet">
        <h1 class="d-title" id="dTitle"></h1>
        <p class="d-sub" id="dSub"></p>

        <div class="d-facts">
          <div class="d-fact"><div class="k">时长</div><div class="v" id="dTime"></div></div>
          <div class="d-fact"><div class="k">口味</div><div class="v" id="dFlavor"></div></div>
          <div class="d-fact"><div class="k">分量</div><div class="v" id="dServing"></div></div>
        </div>

        <p class="d-quote" id="dQuote"></p>

        <div class="d-h"><h2>食材</h2><span>INGREDIENTS</span></div>
        <div id="dIng"></div>

        <div class="d-h"><h2>做法</h2><span>METHOD</span></div>
        <div id="dSteps"></div>
      </div>
    </div>

    <div class="d-bar">
      <div class="stepper">
        <button id="qMinus" aria-label="减少">−</button>
        <span class="qty" id="qty">1</span>
        <button id="qPlus" aria-label="增加">+</button>
      </div>
      <button class="add-btn" id="addBtn">加入点单</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <!-- 底部导航 -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="on" data-tab="menu">专属菜单<span class="dot"></span></button>
    <button data-tab="order">我的点单<span class="dot"></span></button>
  </nav>
</div>

<script>
/* ---------------- 数据 ---------------- */
const CATS = [
  { key:'main',   name:'主菜', icon:'<path d="M2 10h18c0 5-3.6 8-9 8s-9-3-9-8Z"/><path d="M9 6c0-2 1.5-2 1.5-4M13.5 6c0-2 1.5-2 1.5-4"/>' },
  { key:'veg',    name:'蔬菜', icon:'<path d="M12 21c0-6 3-11 8-12-1 7-4 10-8 12Z"/><path d="M12 21C12 15 9 10 4 9c1 7 4 10 8 12Z"/><path d="M12 21v-6"/>' },
  { key:'soup',   name:'炖汤', icon:'<path d="M4 11h16c0 5-3.6 9-8 9s-8-4-8-9Z"/><path d="M8 7c0-2 1-2 1-3.5M12 7c0-2 1-2 1-3.5M16 7c0-2 1-2 1-3.5"/>' }
];

const DISHES = {
  main:[
    { name:'虾仁滑蛋', desc:'鸡蛋柔嫩，虾仁清甜。', time:'约 15 分钟', tag:'鲜香嫩滑',

      chef:'「蛋要嫩，铲子就得懒一点——少翻，慢推。」',

    { name:'马哥超绝炒鸡公', desc:'超水准的招牌菜不解释', time:'约 30 分钟', tag:'香辣 回味无穷',

      chef:'「这道菜不解释，吃过的都懂。」',

/* ---------------- 渲染 ---------------- */
const tabsEl = document.getElementById('tabs');
const pillEl = document.getElementById('pill');
const menuEl = document.getElementById('menu');
const scrollEl = document.getElementById('scroll');
let current = 0;

CATS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'tab' + (i === 0 ? ' active' : '');
  b.innerHTML = `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg><span>${c.name}</span>`;
  b.addEventListener('click', () => selectCat(i));
  tabsEl.appendChild(b);
});

function movePill(i){
  pillEl.style.transform = `translateX(${i * 100}%)`;
}

function renderList(){
  const key = CATS[current].key;
  menuEl.innerHTML = DISHES[key].map((d, i) => `
    <article class="dish" style="--i:${i}" data-i="${i}">
      <img class="thumb" src="${d.img}" alt="${d.name}" loading="lazy"
           onerror="this.style.visibility='hidden'">
      <div class="dish-info">
        <h3 class="dish-name">${d.name}</h3>
        <p class="dish-desc">${d.desc}</p>
        <div class="dish-meta">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>
          </svg>
          <span>${d.time}</span><span class="sep"></span><span>${d.tag}</span>
        </div>
      </div>
    </article>`).join('');
}

function selectCat(i){
  current = i;
  [...tabsEl.querySelectorAll('.tab')].forEach((t, k) => t.classList.toggle('active', k === i));
  movePill(i);
  renderList();
  scrollEl.scrollTo({ top: 0, behavior: 'smooth' });
}

/* 底部导航切换 */
document.getElementById('bottomNav').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;
  [...e.currentTarget.querySelectorAll('button')].forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
});

/* Tab 栏吸顶阴影 */
scrollEl.addEventListener('scroll', () => {
  document.getElementById('tabsWrap').classList.toggle('stuck', scrollEl.scrollTop > 8);
}, { passive:true });

/* ---------------- 菜品详情页 ---------------- */
const detailEl     = document.getElementById('detail');
const detailScroll = document.getElementById('detailScroll');
const dImg    = document.getElementById('dImg');
const dChip   = document.getElementById('dChip');
const dTitle  = document.getElementById('dTitle');
const dSub    = document.getElementById('dSub');
const dTime   = document.getElementById('dTime');
const dFlavor = document.getElementById('dFlavor');
const dServing= document.getElementById('dServing');
const dQuote  = document.getElementById('dQuote');
const dIng    = document.getElementById('dIng');
const dSteps  = document.getElementById('dSteps');
const qtyEl   = document.getElementById('qty');
const toastEl = document.getElementById('toast');
let curDish = null, qty = 1;

function openDetail(catKey, i, catName){
  const d = DISHES[catKey][i];
  curDish = d; setQty(1);

  dImg.src = d.img; dImg.alt = d.name;
  dChip.textContent = catName;
  dTitle.textContent = d.name;
  dSub.textContent = d.desc;
  dTime.textContent = d.time.replace('约 ', '');
  dFlavor.textContent = d.flavor;
  dServing.textContent = d.serving;
  dQuote.innerHTML = `${d.chef}<span class="who">— 你的专属主厨 Pali</span>`;
  dIng.innerHTML = d.ing.map(s => {
    const [n, a] = s.split('|');
    return `<div class="d-ing"><span>${n}</span><span class="dots"></span><span class="amt">${a}</span></div>`;
  }).join('');
  dSteps.innerHTML = d.steps.map((s, k) =>
    `<div class="d-step"><span class="no">${String(k + 1).padStart(2, '0')}</span><p>${s}</p></div>`
  ).join('');

  detailScroll.scrollTop = 0;
  detailEl.classList.add('open');
  detailEl.setAttribute('aria-hidden', 'false');
}

function closeDetail(){
  detailEl.classList.remove('open');
  detailEl.setAttribute('aria-hidden', 'true');
}

function setQty(n){ qty = Math.max(1, n); qtyEl.textContent = qty; }

let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

/* 点击菜品进入详情 */
menuEl.addEventListener('click', e => {
  const art = e.target.closest('.dish');
  if(!art) return;
  openDetail(CATS[current].key, Number(art.dataset.i), CATS[current].name);
});

document.getElementById('dBack').addEventListener('click', closeDetail);
document.getElementById('qMinus').addEventListener('click', () => setQty(qty - 1));
document.getElementById('qPlus').addEventListener('click', () => setQty(qty + 1));
document.getElementById('addBtn').addEventListener('click', () => {
  if(!curDish) return;
  toast(`${curDish.name} × ${qty} 已加入点单`);
});

/* 初始化 */
movePill(0);
renderList();
</script>
</body>
</html>
